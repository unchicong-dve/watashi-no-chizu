const reasons=['できなかったことができるようになったから','自分の成長を感じられたから','目標としていたことを達成できたから','努力してきたことが報われたから','誰かに褒めてもらえたから','自分の頑張りや能力を認めてもらえたから','誰かの役に立てたから','誰かに喜んでもらえたから','仲間と一緒に何かを成し遂げられたから','誰かと喜びを分かち合えたから','自分の意思で選んだことがうまくいったから','自分らしく行動できたから','好きなことに取り組めたから','期待していたことが実現したから','思いがけず良いことが起きたから','大切な人とのつながりを感じられたから','他の人より良い結果を出せたから','自分が必要とされていると感じたから','不安や心配が解消されたから','その他'];
const initial=()=>({stages:stagesDefault.map((name,i)=>({id:'st'+i,name,order:i})),activities:[],events:[],last:null,settings:{mode:'normal',idle:15},version:1});let db,storageAvailable=false;try{const probe="__watashi_storage_probe__";localStorage.setItem(probe,"1");storageAvailable=localStorage.getItem(probe)==="1";localStorage.removeItem(probe)}catch(e){}try{db=storageAvailable?(JSON.parse(localStorage.getItem(KEY))||initial()):initial()}catch{db=initial()}let view='home',currentEvent=null,currentScene=null,currentQ=1,modal=null,toastText='',draftTimer=null,session=null,lastInteraction=Date.now(),expanded={},selectedAnalysis='emotion';const id=()=>typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'?crypto.randomUUID():'id'+Date.now()+'-'+Math.random().toString(36).slice(2);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const eventBy=i=>db.events.find(x=>x.id===i);const sceneBy=(e,i)=>e?.scenes.find(s=>s.id===i);const stageName=i=>db.stages.find(x=>x.id===i)?.name||'未設定';const actName=i=>db.activities.find(x=>x.id===i)?.name||'活動なし';const effVisible=e=>e.visible!==false&&(!e.activityId||db.activities.find(a=>a.id===e.activityId)?.visible!==false);const effIncluded=e=>e.included!==false&&(!e.activityId||db.activities.find(a=>a.id===e.activityId)?.included!==false);const usableScenes=e=>e.scenes.filter(s=>s.visible!==false);const analyzedScenes=e=>effIncluded(e)?e.scenes.filter(s=>s.included!==false):[];const qdata=(e,s,q)=>{const obj=q<=2?e:s;if(!obj.answers)obj.answers={};if(!obj.answers[q])obj.answers[q]={text:'',choices:[],status:'untouched',seconds:0,editedSeconds:null};return obj.answers[q]};const save=()=>{if(!storageAvailable){notify("この環境では自動保存できません。データ管理からJSONを保存してください");return false}try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(err){notify("保存に失敗しました。JSONバックアップをお試しください");return false}};const notify=t=>{toastText=t;const x=document.getElementById('toast function homePage(){const active=db.events.filter(e=>!e.complete&&effVisible(e)).slice().reverse().slice(0,3);const last=eventBy(db.last?.eventId);return `<div class="top"><div><div class="eyebrow">WELCOME BACK</div><h1 class="h1">自分のペースで、振り返ろう。</h1><div class="sub">うまく書こうとしなくて大丈夫。思い出せるところから。</div></div></div>${last&&effVisible(last)?`<section class="panel"><div class="eyebrow">前回の続き</div><h3>${esc(last.name)}</h3><p class="muted">${esc(stageName(last.stageId))} ・ ${db.last.q===2?'場面を整理':`Q${db.last.q}　${esc(questions[db.last.q-1])}`}</p>${button('続きを始める →',`openEditor('${last.id}','${db.last.sceneId||''}',${db.last.q})`,'primary')}</section>`:''}<div class="grid"><section class="panel"><h3>＋ 新しい出来事</h3><p class="sub">まずは出来事の名前だけでOK。</p>${button('出来事を追加',"go('create')",'primary')}</section><section class="panel"><h3>▤ 自分史を見る</h3><p class="sub">これまでに記録した経験を振り返る。</p>${button('自分史を開く',"go('history')")}</section></div><section class="panel"><div class="row"><h3>取り組み中の出来事</h3>${button('すべて見る →',"go('history')",'small ghost')}</div>${active.length?`<div class="list">${active.map(e=>{let [a,b]=count(e);return `<div class="item"><div class="row"><b>${esc(e.name)}</b><span class="pill">${esc(stageName(e.stageId))}</span></div><p class="tiny muted">回答済み ${a}/${b}問</p><div class="bar"><div style="width:${b?a/b*100:0}%"></div></div><div style="margin-top:12px">${button('開く',`openReview('${e.id}')`,'small')}</div></div>`}).join('')}</div>`:'<div class="empty">まだ取り組み中の出来事はありません。</div>'}</section>`}

function fillActivities(){const sid=document.getElementById('newStage').value;document.getElementById('newActivity').innerHTML=`<option value="">活動を指定しない</option>${db.activities.filter(a=>a.stageId===sid).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}<option value="__new">新しい活動を追加</option>`}
function createHistoryEvent(){

 try{
  const stageEl=document.getElementById('newStage'),nameEl=document.getElementById('newName'),actEl=document.getElementById('newActivity'),actNameEl=document.getElementById('newActivityName');

  if(!name){report('③ 出来事の名前を入力してください。');nameEl.focus();return}
  if(act==='__new'&&!actText){report('② 新しい活動名を入力してください。');actNameEl.focus();return}

 if(q===3&&s){if(s.valence!==null&&s.valence!==undefined)bits.push(`<p class="tiny muted">場面全体の気持ち：${s.valence>0?'+':''}${s.valence}</p>`);const a=Object.entries(d.intensity||{}).filter(([_,v])=>v!==null&&v!==undefined&&v!=='');if(a.length)bits.push(`<p class="tiny muted">気持ちの強さ：${a.map(([k,v])=>esc(k)+' '+esc(v)+'/5').join('、')}</p>`)}

function reviewPage(){const e=eventBy(currentEvent);if(!e)return historyPage();const [done,total]=count(e);return `<div class="eyebrow">REVIEW</div><h1 class="h1">${esc(e.name)}</h1><p class="sub">${esc(stageName(e.stageId))} ＞ ${esc(actName(e.activityId))} ・ ${e.complete?'出来事の振り返り完了':'取り組み中'}</p><div class="notice">ここは回答の閲覧画面です。内容は変更されません。修正したいときだけ「回答を修正する」を選んでください。</div><div class="row" style="margin:18px 0"><span class="pill">回答済み ${done}/${total}問</span><div class="row">${button('← 自分史へ',"go('history')")}${button('回答を修正する',`openEditor('${e.id}')`,'primary')}</div></div><section class="panel"><h3>出来事について</h3>${reviewAnswer(e,null,1)}${reviewAnswer(e,null,2)}</section>${e.scenes.length?e.scenes.map((sc,i)=>`<section class="panel"><div class="row"><h3>場面 ${i+1}：${esc(sc.name)}</h3><span class="pill">${sc.visible===false?'非表示':'表示中'}</span></div>${sc.description?.trim()?`<p class="sub">${esc(sc.description)}</p>`:''}${[3,4,5,6,7,8].map(q=>reviewAnswer(e,sc,q)).join('')}</section>`).join(''):'<section class="panel"><p class="muted">場面はまだ登録されていません。</p></section>'}<div class="row" style="margin:22px 0">${button('← 自分史へ',"go('history')")}${button('回答を修正する',`openEditor('${e.id}')`,'primary')}</div>`}
function editPage(){const e=eventBy(currentEvent);if(!e)return homePage();const s=sceneBy(e,currentScene);const q=currentQ;const data=q===2?null:qdata(e,s,q);const total=count(e);return `<div class="eyebrow">DEEP DIVE</div><div class="row"><div><h1 class="h1">${esc(e.name)}</h1><div class="muted tiny">${esc(stageName(e.stageId))} ＞ ${esc(actName(e.activityId))}</div></div><div class="row">${button('出来事を管理',"openManage()",'small')}${button(e.complete?'完了済み':'出来事を完了',"finishEvent()",'small primary')}</div></div><section class="panel"><div class="row"><span class="pill">回答済み ${total[0]}/${total[1]}問</span><div class="row"><span class="tiny muted" id="timerDisplay">計測停止中</span>${button('計測を再開','startTimer()','small')}</div></div><div class="qnav">${questions.map((_,i)=>`<button class="${q===i+1?'active':''}" onclick="switchQ(${i+1})">Q${i+1}</button>`).join('')}</div>${q>=3?`<div class="scene-nav">${usableScenes(e).map(sc=>`<button class="${currentScene===sc.id?'active':''}" onclick="switchScene('${sc.id}')">${esc(sc.name)}</button>`).join('')}${button('＋ 場面',"addScene()",'small')}</div>`:''}<hr class="hr"><div class="eyebrow">QUESTION ${q} / 8</div><h2 class="question">${esc(questions[q-1])}</h2>${q===2?sceneEditor(e):questionEditor(e,s,q,data)}<hr class="hr"><div class="row">${button('← 前の質問','switchQ('+Math.max(1,q-1)+')')}${`<button id="nextQuestionButton" class="btn primary" onclick="advanceQuestion()" ${['done','hold','unknown','skip'].includes(qdata(e,s,q).status)?'':'disabled'}>${q===8?'振り返りを終える →':'次の質問 →'}</button>`}</div></section>`}
function sceneEditor(e){return `<p class="sub">印象に残っている場面を、思い出した順に追加しましょう。後から並べ替えられます。</p><div class="list">${e.scenes.map((s,i)=>`<div class="item"><div class="row"><div><b>${esc(s.name)}</b><p class="tiny muted">${esc(s.description||'説明なし')}</p></div><div class="row">${button('↑',`moveScene('${s.id}',-1)`,'small')}${button('↓',`moveScene('${s.id}',1)`,'small')}${button('編集',`editScene('${s.id}')`,'small')}${button('深掘り',`switchScene('${s.id}');switchQ(3)`,'small primary')}</div></div></div>`).join('')}</div><div style="margin-top:14px">${button('＋ 場面を追加','addScene()','primary')}</div><div class="row" style="margin-top:22px">${button('Q2を回答完了',"setQuestionStatus('done',2)",'primary')}${button('保留',"setQuestionStatus('hold',2)")}</div>`}
function questionEditor(e,s,q,d){if(!d)return '<div class="notice">まずQ2で場面を追加してください。</div>';let optionsHtml='';if(q===4){const selected=qdata(e,s,3).choices;optionsHtml=selected.length?`<p class="muted tiny">Q3で選んだ気持ちごとに理由を整理できます。</p>${selected.map(em=>`<details style="margin:9px 0" open><summary><b>${esc(em)}</b>と感じた理由（任意）</summary><div class="checks">${reasons.slice(0,expanded[em]?reasons.length:8).map(r=>`<button class="chip ${(d.reasons?.[em]||[]).includes(r)?'on':''}" onclick="toggleReason('${encodeURIComponent(em)}','${encodeURIComponent(r)}')">${esc(r)}</button>`).join('')}</div>${!expanded[em]?button('もっと見る',`expandReason('${encodeURIComponent(em)}')`,'small'):''}<textarea placeholder="この気持ちの理由を自由に書く" oninput="editReasonText('${encodeURIComponent(em)}',this.value)">${esc(d.reasonTexts?.[em]||'')}</textarea></details>`).join('')}`:'<div class="help">Q3で気持ちを選ぶと、気持ち別の理由も選べます。ここは自由記述だけでもOK。</div>'}else if(options[q])optionsHtml=`<details open><summary>選択肢から考える（任意）</summary><div class="checks">${options[q].map(c=>`<button class="chip ${d.choices.includes(c)?'on':''}" onclick="toggleChoice('${encodeURIComponent(c)}')">${esc(c)}</button>`).join('')}</div></details>`;let extras='';if(q===3){extras=`<div class="field"><label>場面全体の気持ち（任意・−5〜＋5）</label><select onchange="setValence(this.value)"><option value="">数値を付けない</option>${Array.from({length:11},(_,i)=>i-5).map(v=>`<option value="${v}" ${s.valence===v?'selected':''}>${v>0?'+':''}${v}</option>`).join('')}</select><small>感情の強さとは別の記録です。未入力を0として扱いません。</small></div>${d.choices.filter(x=>x!=='その他').map(em=>`<div class="row tiny" style="margin:8px 0"><span>${esc(em)} の強さ（任意）</span><select style="width:100px" onchange="setIntensity('${encodeURIComponent(em)}',this.value)"><option value="">未入力</option>${[1,2,3,4,5].map(n=>`<option ${d.intensity?.[em]===n?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}`};return `<div class="field"><label>自由に書く（任意）</label><textarea id="answerText" oninput="editText(this.value)" placeholder="思いついたことを、そのまま書いてみましょう。">${esc(d.text)}</textarea></div>${optionsHtml}${extras}<div class="help" style="margin-top:18px">どの質問も飛ばせます。答えたくないことを無理に書く必要はありません。</div><div class="row" style="margin-top:20px"><span class="pill">${statusText(d.status)}</span><div class="row">${button('保留',"setQuestionStatus('hold')",'small')}${button('思い出せない',"setQuestionStatus('unknown')",'small')}${button('回答しない',"setQuestionStatus('skip')",'small')}${button('回答完了',"setQuestionStatus('done')",'primary')}</div></div>`}
function markEditing(){const e=eventBy(currentEvent),s=sceneBy(e,currentScene),d=qdata(e,s,currentQ);if(d.status!=='editing')d.status='editing';const next=document.getElementById('nextQuestionButton');if(next)next.disabled=true;db.last={eventId:e.id,sceneId:currentScene,q:currentQ};save()}function editText(v){const e=eventBy(currentEvent),s=sceneBy(e,currentScene);qdata(e,s,currentQ).text=v;markEditing()}function toggleChoice(x){const e=eventBy(currentEvent),s=sceneBy(e,currentScene),d=qdata(e,s,currentQ),v=decodeURIComponent(x);d.choices=d.choices.includes(v)?d.choices.filter(z=>z!==v):[...d.choices,v];markEditing();render()}function toggleReason(a,b){const em=decodeURIComponent(a),r=decodeURIComponent(b),e=eventBy(currentEvent),d=qdata(e,sceneBy(e,currentScene),4);d.reasons??={};d.reasons[em]??=[];d.reasons[em]=d.reasons[em].includes(r)?d.reasons[em].filter(x=>x!==r):[...d.reasons[em],r];markEditing();render()}function editReasonText(a,v){const em=decodeURIComponent(a),e=eventBy(currentEvent),d=qdata(e,sceneBy(e,currentScene),4);d.reasonTexts??={};d.reasonTexts[em]=v;markEditing()}function expandReason(a){expanded[decodeURIComponent(a)]=true;render()}function setValence(v){sceneBy(eventBy(currentEvent),currentScene).valence=v===''?null:Number(v);markEditing();render()}function setIntensity(a,v){const e=eventBy(currentEvent),d=qdata(e,sceneBy(e,currentScene),3);d.intensity??={};d.intensity[decodeURIComponent(a)]=v===''?null:Number(v);markEditing();render()}
function setQuestionStatus(st,q=currentQ){const e=eventBy(currentEvent),s=sceneBy(e,currentScene),d=qdata(e,s,q);if(st==='done'&&q!==2&&!d.text.trim()&&!d.choices.length&&!(q===3&&s?.valence!=null)){if(!confirm('回答が入力されていません。このまま回答完了にしますか？'))return}d.status=st;save();notify(st==='done'?'回答完了にしました':'状態を更新しました');render()}function advanceQuestion(){const e=eventBy(currentEvent),s=sceneBy(e,currentScene),d=qdata(e,s,currentQ);if(!['done','hold','unknown','skip'].includes(d.status)){notify('先に回答の状態を選んでください');return}if(currentQ<8){switchQ(currentQ+1);return}stopTimer();view='history';db.last={eventId:e.id,sceneId:currentScene,q:8};save();render();notify('Q8まで進みました。出来事の完了は別途選択できます')}function switchQ(q){stopTimer();const e=eventBy(currentEvent);currentQ=q;if(q>=3&&!currentScene){currentScene=e.scenes[0]?.id||null;if(!currentScene){currentQ=2;notify('まず場面を追加してください')}}db.last={eventId:e.id,sceneId:currentScene,q:currentQ};save();render();startTimer()}function switchScene(id){stopTimer();currentScene=id;db.last={eventId:currentEvent,sceneId:id,q:currentQ};save();render();startTimer()}function addScene(){const name=prompt('場面の名前を入力してください（例：本番）');if(!name?.trim())return;const e=eventBy(currentEvent),s={id:id(),name:name.trim(),description:'',answers:{},visible:true,included:true,valence:null};e.scenes.push(s);currentScene=s.id;save();render();notify('場面を追加しました')}function editScene(sid){const e=eventBy(currentEvent),s=sceneBy(e,sid),name=prompt('場面の名前',s.name);if(name===null||!name.trim())return;s.name=name.trim();const desc=prompt('場面の説明（任意）',s.description||'');if(desc!==null)s.description=desc;save();render()}function moveScene(sid,delta){const e=eventBy(currentEvent),i=e.scenes.findIndex(x=>x.id===sid),j=i+delta;if(j<0||j>=e.scenes.length)return;[e.scenes[i],e.scenes[j]]=[e.scenes[j],e.scenes[i]];save();render()}
function finishEvent(){const e=eventBy(currentEvent);if(e.complete){modal={type:'unfinish'};render();return}const [a,b]=count(e);if(a<b&&!confirm(`未回答・未完了の質問が${b-a}件あります。このまま出来事を完了しますか？`))return;e.complete=true;save();render();notify('出来事を完了しました')}function openManage(){modal={type:'manage'};render()}function modalHtml(){if(modal.type==='resume')return `<div class="modal-back"><div class="modal"><h2>前回の続きから再開しますか？</h2><p class="sub">${esc(eventBy(currentEvent)?.name)} ／ Q${currentQ} の回答画面を開いています。</p><div class="row">${button('ホームに戻る',"closeModal();go('home')")}${button('続きを始める',"closeModal();startTimer()",'primary')}</div></div></div>`;if(modal.type==='unfinish')return `<div class="modal-back"><div class="modal"><h2>出来事の振り返りを再開</h2><p>完了状態を解除して、再び取り組み中にしますか？</p><div class="row">${button('キャンセル','closeModal()')}${button('再開する',"reopenEvent()",'primary')}</div></div></div>`;if(modal.type==='manage'){const e=eventBy(currentEvent);return `<div class="modal-back"><div class="modal"><h2>出来事を管理</h2><div class="field"><label>出来事名</label><input id="manageName" value="${esc(e.name)}"></div><div class="field"><label>ライフステージ</label><select id="manageStage">${db.stages.map(st=>`<option value="${st.id}" ${e.stageId===st.id?'selected':''}>${esc(st.name)}</option>`).join('')}</select></div><div class="field"><label>活動（変更先ステージにない場合は活動なし）</label><select id="manageActivity"><option value="">活動なし</option>${db.activities.map(a=>`<option value="${a.id}" ${e.activityId===a.id?'selected':''}>${esc(a.name)}（${esc(stageName(a.stageId))}）</option>`).join('')}</select></div><label class="switch"><input id="manageVisible" type="checkbox" ${e.visible!==false?'checked':''}>自分史に表示する</label><label class="switch"><input id="manageIncluded" type="checkbox" ${e.included!==false?'checked':''}>分析に使用する</label><div class="row" style="margin-top:24px">${button('キャンセル','closeModal()')}${button('変更を保存','saveManage()','primary')}</div></div></div>`}return ''}function closeModal(){modal=null;render()}function reopenEvent(){eventBy(currentEvent).complete=false;save();closeModal()}function saveManage(){const e=eventBy(currentEvent),stageId=document.getElementById('manageStage').value,act=document.getElementById('manageActivity').value;e.name=document.getElementById('manageName').value.trim()||e.name;e.stageId=stageId;e.activityId=db.activities.find(a=>a.id===act&&a.stageId===stageId)?act:'';e.visible=document.getElementById('manageVisible').checked;e.included=document.getElementById('manageIncluded').checked;save();closeModal();notify('変更を保存しました')}
function recordsPage(){return `<div class="eyebrow">ALL RECORDS</div><h1 class="h1">全記録一覧</h1><p class="sub">非表示にした記録もここから戻せます。完全削除には、事前に設定した削除用パスワードが必要です。</p><section class="panel"><div class="list">${db.events.length?db.events.map(e=>`<div class="item"><div class="row"><div><b>${esc(e.name)}</b><div class="tiny muted">${esc(stageName(e.stageId))} ・ ${e.visible===false?'非表示':'表示中'} ・ ${e.included===false?'分析対象外':'分析対象'}</div></div><div class="row">${button(e.visible===false?'再表示':'非表示',`toggleEventVisible('${e.id}')`,'small')}${button('開く',`openReview('${e.id}')`,'small')}${button('完全削除',`requestDeleteEvent('${e.id}')`,'small danger')}</div></div>${e.scenes.map(s=>`<div class="row tiny" style="padding:3px 12px 10px 25px"><span>└ ${esc(s.name)} ${s.visible===false?'（非表示）':''}</span>${button(s.visible===false?'再表示':'非表示',`toggleSceneVisible('${e.id}','${s.id}')`,'small')}</div>`).join('')}`).join(''):'<div class="empty">記録はまだありません。</div>'}</div></section>`}// Password is a local deletion safeguard, not an authentication or encryption boundary.
function passwordFingerprint(password,salt){let h1=2166136261,h2=2246822519;const input=salt+'|'+password;for(let i=0;i<input.length;i++){const c=input.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^c,3266489917)}return (h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')}
function verifyDeletePassword(value){return !!db.settings.deletePasswordHash&&passwordFingerprint(value,db.settings.deletePasswordSalt)===db.settings.deletePasswordHash}
function configureDeletePassword(){db.settings=db.settings||{};if(db.settings.deletePasswordHash){const old=prompt('現在の削除用パスワードを入力してください');if(old===null)return;if(!verifyDeletePassword(old)){alert('パスワードが違います');return}}const next=prompt('新しい削除用パスワードを入力してください（8文字以上）');if(next===null)return;if(next.length<8){alert('8文字以上で設定してください');return}const check=prompt('確認のため、同じパスワードをもう一度入力してください');if(check===null)return;if(next!==check){alert('パスワードが一致しません');return}const salt=id();db.settings.deletePasswordSalt=salt;db.settings.deletePasswordHash=passwordFingerprint(next,salt);save();render();notify('削除用パスワードを設定しました')}
function requestDeleteEvent(eid){const e=eventBy(eid);if(!e)return;if(!db.settings?.deletePasswordHash){alert('完全削除するには、先に「データ管理」で削除用パスワードを設定してください');return}const pw=prompt('「'+e.name+'」を完全削除します。削除用パスワードを入力してください');if(pw===null)return;if(!verifyDeletePassword(pw)){alert('パスワードが違います。削除は行いませんでした');return}if(!confirm('「'+e.name+'」とその中のすべての場面・回答を完全削除します。元に戻せません。続けますか？'))return;db.events=db.events.filter(x=>x.id!==eid);if(db.last?.eventId===eid)db.last=null;if(currentEvent===eid){currentEvent=null;currentScene=null}if(save()){render();notify('出来事を完全削除しました')}}

function analysisPage(){return `<div class="eyebrow">DISCOVER YOURSELF</div><h1 class="h1">自分を知る</h1><p class="sub">これは診断ではありません。記録から見つかる、振り返りのヒントです。</p><div class="tabs">${[['emotion','① 気持ち'],['patterns','② 行動・価値観'],['compare','③ 時期ごとの比較']].map(([k,t])=>`<button class="${selectedAnalysis===k?'active':''}" onclick="selectedAnalysis='${k}';render()">${t}</button>`).join('')}</div>${selectedAnalysis==='emotion'?emotionAnalysis():selectedAnalysis==='patterns'?patternAnalysis():compareAnalysis()}${mbtiPanel()}`}
function allScenes(){return db.events.flatMap(e=>analyzedScenes(e).map(s=>({e,s})))}function emotionAnalysis(){const rows=allScenes().filter(({s})=>qdata(null,s,3).text||qdata(null,s,3).choices.length||s.valence!==null&&s.valence!==undefined);return `<section class="panel"><h3>気持ちの記録</h3><p class="sub tiny">数値を付けた場面だけを点で表示します。点と点を線で結びません。</p><svg id="emotionGraph" class="graph" viewBox="0 0 720 260" role="img" aria-label="場面ごとの気持ちの点グラフ"></svg></section><section class="panel"><h3>気持ちの記録一覧</h3>${rows.length?`<div class="list">${rows.map(({e,s})=>`<div class="item row"><div><b>${esc(s.name)}</b><div class="tiny muted">${esc(stageName(e.stageId))} ＞ ${esc(e.name)} ・ ${s.valence==null?'数値未入力':(s.valence>0?'+':'')+s.valence}</div></div>${button('回答を見る',`openReview('${e.id}')`,'small')}</div>`).join('')}</div>`:'<div class="empty">まだ気持ちの記録がありません。Q3から始められます。</div>'}</section>`}function drawGraph(){const svg=document.getElementById('emotionGraph');if(!svg)return;const entries=allScenes().filter(({s})=>s.valence!==null&&s.valence!==undefined).sort((a,b)=>db.stages.findIndex(x=>x.id===a.e.stageId)-db.stages.findIndex(x=>x.id===b.e.stageId));let out='<line x1="50" y1="125" x2="690" y2="125" stroke="#b8c8c2" stroke-dasharray="4 4"/>';for(const [i,v] of [[0,'+5'],[5,'0'],[10,'−5']])out+=`<text x="12" y="${25+i*20}" fill="#728079" font-size="14">${v}</text>`;entries.forEach(({e,s},i)=>{const x=entries.length===1?370:70+i*600/(entries.length-1),y=25+(5-s.valence)*20;out+=`<circle cx="${x}" cy="${y}" r="7" fill="#397b70"><title>${esc(e.name)} / ${esc(s.name)}: ${s.valence}</title></circle><text x="${x}" y="245" font-size="12" text-anchor="middle" fill="#62766d">${esc(stageName(e.stageId))}</text>`});if(!entries.length)out+='<text x="360" y="120" text-anchor="middle" fill="#82908a" font-size="15">数値を入力した場面はまだありません</text>';svg.innerHTML=out}
function patternAnalysis(){const rows=allScenes(),counter={};for(const {s} of rows)for(const q of [3,5,6,7,8])for(const ch of qdata(null,s,q).choices)if(ch!=='その他')counter[ch]=(counter[ch]||0)+1;const arr=Object.entries(counter).sort((a,b)=>b[1]-a[1]).slice(0,12);return `<section class="panel"><h3>回答に登場した言葉</h3><p class="sub tiny">これは価値観や性格の判定ではありません。選択した言葉の登場回数です。</p>${arr.length?arr.map(([k,n])=>`<div class="row" style="margin:14px 0"><span>${esc(k)}</span><span class="pill">${n}件</span></div>`).join(''):'<div class="empty">まだ集計できる選択式の回答がありません。</div>'}</section><div class="notice">価値観の候補提示・本人による採用／保留／否定は、今後の更新で追加する予定です。</div>`}function compareAnalysis(){return `<section class="panel"><h3>時期ごとの記録</h3><p class="sub tiny">件数は自己分析の進み具合や能力を評価するものではありません。</p>${db.stages.map(st=>{const e=db.events.filter(x=>x.stageId===st.id&&effIncluded(x)),n=e.reduce((a,x)=>a+analyzedScenes(x).length,0);return `<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(st.name)}</b><span class="muted tiny">出来事 ${e.length}件・場面 ${n}件</span></div>`}).join('')}</section>`}
// MBTI is a user-entered reflection aid, not an inferred psychological diagnosis.
const mbtiMeanings={E:['外向（E）','人や外の世界との関わりから刺激を受けやすいという傾向'],I:['内向（I）','一人で考えたり内側で整理したりする時間を好むという傾向'],S:['感覚（S）','具体的な事実や経験に目を向けやすいという傾向'],N:['直観（N）','可能性や全体像、つながりに目を向けやすいという傾向'],T:['思考（T）','判断の際に論理や整合性を重視しやすいという傾向'],F:['感情（F）','判断の際に人への影響や大切にしたい価値を重視しやすいという傾向'],J:['判断（J）','見通しや計画を立てて進めることを好みやすいという傾向'],P:['知覚（P）','状況に応じて選択肢を残すことを好みやすいという傾向']};
function mbtiPanel(){const type=db.settings?.mbti||'';return `<section class="panel"><div class="eyebrow">OPTIONAL SELF-REFLECTION</div><h3>MBTIから考える、自分の傾向</h3><p class="sub tiny">自分で把握しているタイプを任意で登録できます。出来事の回答からMBTIを推定したり、人格を断定したりはしません。</p><div class="field"><label for="mbtiType">あなたのMBTIタイプ（任意）</label><select id="mbtiType" onchange="saveMbti(this.value)"><option value="">選択しない</option>${['E','I'].flatMap(a=>['S','N'].flatMap(b=>['T','F'].flatMap(c=>['J','P'].map(d=>a+b+c+d)))).map(t=>`<option value="${t}" ${type===t?'selected':''}>${t}</option>`).join('')}</select></div>${type?`<div class="notice"><b>${esc(type)}を手がかりに考えられること</b><p class="tiny muted">以下はMBTIの4つの指標についての一般的な説明です。あなたに必ず当てはまるという意味ではありません。</p>${type.split('').map(c=>`<p><b>${mbtiMeanings[c][0]}</b> — ${mbtiMeanings[c][1]}</p>`).join('')}<p class="tiny muted">実際のあなたを理解するには、記録した出来事と照らし合わせて、当てはまる点・違う点を自分で判断してみてください。</p></div>`:''}</section>`}

// Create a clean printable document from stored events, not a printout of the app UI.
function openPdfExport(){const candidates=db.events; if(!candidates.length){alert('まだ出来事がありません。出来事を登録してからお試しください。');return}const rows=candidates.map(e=>`<label class="pdf-pick"><input type="checkbox" name="pdfEvent" value="${esc(e.id)}" checked><span><b>${esc(e.name)}</b><small>${esc(stageName(e.stageId))} ・ 場面 ${e.scenes.length}件</small></span></label>`).join('');const overlay=document.createElement('div');overlay.className='modal-back';overlay.id='pdfExportModal';overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="pdfTitle"><h2 id="pdfTitle">自分史レポートを作成</h2><p class="sub">PDFに載せたい出来事を選んでください。質問と回答をまとめた、印刷用のレイアウトを作ります。</p><div style="max-height:42vh;overflow:auto">${rows}</div><div class="row" style="margin-top:18px"><button class="btn" onclick="document.querySelectorAll('#pdfExportModal input').forEach(x=>x.checked=true)">すべて選択</button><button class="btn" onclick="document.querySelectorAll('#pdfExportModal input').forEach(x=>x.checked=false)">選択解除</button></div><div class="row" style="margin-top:20px"><button class="btn" onclick="document.getElementById('pdfExportModal').remove()">キャンセル</button><button class="btn primary" onclick="generatePdfReport()">レポートを表示 →</button></div></div>`;document.body.appendChild(overlay)}
function pdfAnswer(e,sc,q){const d=(q<=2?e:sc)?.answers?.[q]||{};const parts=[];if(d.text?.trim())parts.push(`<div class="answer-text">${esc(d.text).replace(/\n/g,'<br>')}</div>`);if(d.choices?.length)parts.push(`<p class="tags">${d.choices.map(c=>`<span>${esc(c)}</span>`).join('')}</p>`);if(q===3&&sc){if(sc.valence!=null)parts.push(`<p class="meta">場面全体の気持ち：${sc.valence>0?'+':''}${sc.valence}</p>`);const intensity=Object.entries(d.intensity||{}).filter(([k,v])=>v!=null&&v!=='');if(intensity.length)parts.push(`<p class="meta">気持ちの強さ：${intensity.map(([k,v])=>esc(k)+' '+esc(v)+'/5').join('、')}</p>`)}if(q===4){const active=new Set(sc?.answers?.[3]?.choices||[]);for(const emotion of active){const rs=d.reasons?.[emotion]||[],free=d.reasonTexts?.[emotion]||'';if(rs.length||free.trim())parts.push(`<div class="reason"><b>${esc(emotion)}と感じた理由</b>${rs.length?`<p>${rs.map(esc).join('、')}</p>`:''}${free.trim()?`<p>${esc(free).replace(/\n/g,'<br>')}</p>`:''}</div>`)}}return `<div class="qa"><div class="question"><span class="qnum">Q${q}</span>${esc(questions[q-1])}<span class="status">${esc(statusText(d.status||'untouched'))}</span></div>${parts.length?parts.join(''):'<p class="blank">回答の記録なし</p>'}</div>`}
function generatePdfReport(){const selected=[...document.querySelectorAll('#pdfExportModal input[name="pdfEvent"]:checked')].map(x=>x.value);if(!selected.length){alert('出来事を1つ以上選択してください');return}const events=selected.map(eventBy).filter(Boolean);const report=events.map((e,i)=>`<article class="event"><div class="event-top"><span class="index">EXPERIENCE ${String(i+1).padStart(2,'0')}</span><span>${esc(stageName(e.stageId))}</span></div><h2>${esc(e.name)}</h2><p class="meta">${esc(actName(e.activityId))}　／　場面 ${e.scenes.length}件　／　${e.complete?'振り返り完了':'取り組み中'}</p><h3>出来事の背景と場面</h3>${pdfAnswer(e,null,1)}${pdfAnswer(e,null,2)}${e.scenes.map((sc,j)=>`<section class="scene"><h3>場面 ${j+1}　${esc(sc.name)}</h3>${sc.description?.trim()?`<p class="meta">${esc(sc.description)}</p>`:''}${[3,4,5,6,7,8].map(q=>pdfAnswer(e,sc,q)).join('')}</section>`).join('')||'<p class="blank">場面はまだ登録されていません。</p>'}</article>`).join('');const css=`@page{size:A4;margin:17mm 16mm}*{box-sizing:border-box}body{font-family:system-ui,'Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif;color:#25363a;font-size:10.5pt;line-height:1.65;margin:0;background:white}.cover{padding:35mm 0 24mm;border-bottom:2px solid #397b70;margin-bottom:12mm}.eyebrow,.index{font-size:9pt;letter-spacing:.15em;color:#397b70;font-weight:700}.cover h1{font-size:29pt;margin:12mm 0 3mm}.meta{font-size:9pt;color:#647775}.event{break-before:page;page-break-before:always}.event:first-of-type{break-before:auto;page-break-before:auto}.event-top{display:flex;justify-content:space-between;border-bottom:1px solid #c8dcd3;padding-bottom:4mm;color:#657b74}.event h2{font-size:20pt;margin:7mm 0 2mm;line-height:1.35}.event h3{font-size:12pt;color:#2e675e;margin:9mm 0 3mm}.scene{margin-top:10mm;padding-top:2mm;border-top:2px solid #e0ece7}.qa{margin:4mm 0 5mm;break-inside:avoid;page-break-inside:avoid}.question{font-weight:700;font-size:10pt}.qnum{display:inline-block;color:#397b70;margin-right:7px}.status{font-size:8pt;color:#7a8983;font-weight:400;margin-left:7px}.answer-text{white-space:normal;margin:2mm 0 1mm}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:2mm 0}.tags span{border:1px solid #d8e8e0;border-radius:4px;padding:1px 6px;background:#f5faf7;font-size:9pt}.reason{border-left:2px solid #b6d3c5;padding-left:9px;margin:2mm 0;font-size:9pt}.reason p{margin:1mm 0}.blank{font-size:9pt;color:#89938f;margin:2mm 0}.report-footer{font-size:8pt;color:#82928b;margin-top:15mm;border-top:1px solid #dbe7e1;padding-top:3mm}@media screen{body{max-width:800px;margin:30px auto;padding:30px;box-shadow:0 5px 30px #ddd}.event{margin-top:45px;border-top:1px dashed #ddd;padding-top:25px}.print-actions{position:sticky;top:0;background:white;padding:12px 0;border-bottom:1px solid #ddd}}@media print{.print-actions{display:none}.cover{break-after:page;page-break-after:always}}`;const html=`<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>わたしの地図｜自分史レポート</title><style>${css}</style></head><body><div class="print-actions"><button onclick="window.print()" style="padding:10px 18px;cursor:pointer">印刷・PDFとして保存</button>　ブラウザの印刷先で「PDFとして保存」を選択してください。</div><header class="cover"><div class="eyebrow">MY PERSONAL HISTORY</div><h1>わたしの地図</h1><p>経験を振り返る、自分史レポート</p><p class="meta">作成日：${new Date().toLocaleDateString('ja-JP')}　／　出来事：${events.length}件</p></header>${report}<footer class="report-footer">このレポートは記録した回答を整理したものです。性格や能力を判定するものではありません。</footer></body></html>`;document.getElementById('pdfExportModal')?.remove();showPdfReport(html)}

// Keep the report inside the installed PWA, with an always-visible way back.
function showPdfReport(html){
  document.getElementById('pdfReportView')?.remove();
  const panel=document.createElement('section');
  panel.id='pdfReportView';
  panel.setAttribute('role','dialog');
  panel.setAttribute('aria-label','自分史レポート');
  panel.innerHTML=`<div class="pdf-report-toolbar"><button type="button" class="btn" onclick="closePdfReport()">← わたしの地図に戻る</button><button type="button" class="btn primary" onclick="printPdfReport()">印刷・PDFとして保存</button></div><iframe title="自分史レポートのプレビュー" id="pdfReportFrame"></iframe>`;
  document.body.appendChild(panel);
  const frame=panel.querySelector('iframe');
  // srcdoc keeps the report in the same app without changing its URL.
  frame.srcdoc=html;
  document.body.classList.add('pdf-report-open');
}
function closePdfReport(){
  document.getElementById('pdfReportView')?.remove();
  document.body.classList.remove('pdf-report-open');
}
function printPdfReport(){
  const frame=document.getElementById('pdfReportFrame');
  if(!frame?.contentWindow){alert('レポートを読み込んでからもう一度お試しください。');return}
  try{frame.contentWindow.focus();frame.contentWindow.print()}
  catch(e){alert('印刷画面を開けませんでした。Safariから再度お試しください。')}
}
function helpPage(){return `<div class="eyebrow">APP GUIDE</div><h1 class="h1">？ 使い方</h1><p class="sub">「わたしの地図」は、これまでの経験を記録し、自分の気持ちや大切にしていることを振り返るためのアプリです。書けるところから、少しずつで大丈夫。</p>
<section class="panel"><h3>① 記録をはじめる</h3><p>「自分史」からライフステージを選び、出来事を追加します。出来事の中には場面（シーン）を作って、当時のことや気持ちを質問に沿って記録できます。</p><p class="sub">すべての質問に一度で答える必要はありません。途中から続けることもできます。</p></section>
<section class="panel"><h3>② 振り返る・自分を知る</h3><p>「自分史」で記録を見返せます。「自分を知る」では、入力した記録をもとに経験や感情の傾向を振り返れます。</p><p class="sub">分析は自分を決めつけるものではなく、考えるためのヒントです。</p></section>
<section class="panel"><h3>③ 記録を整理する</h3><p>「全記録一覧」から、出来事や場面を非表示にしたり、再表示したりできます。出来事の完全削除には「データ管理」で設定する削除用パスワードが必要です。</p><p class="sub">完全削除した記録は、バックアップがないと戻せません。</p></section>
<section class="panel"><h3>④ 記録を守る・PDFに保存する</h3><p>「データ管理」の「記録をバックアップ」でJSONファイルを保存してください。機種変更などのときは「保存したファイルから復元」を使います。</p><p><b>重要：</b>復元は今ある記録への追加ではなく、記録全体の置き換えです。復元前にもバックアップしてください。</p><p>「自分史をPDFに保存」からレポートを開き、印刷・PDF保存ができます。レポート画面の「← わたしの地図に戻る」でアプリに戻れます。</p></section>
<section class="panel"><h3>⑤ iPhoneでアプリのように使う</h3><p>Safariで公開URLを開き、共有メニューから「ホーム画面に追加」を選ぶと、ホーム画面から起動できます。初回読み込み後はオフラインでも利用できます。</p><p class="sub">アップデート後は、Safariで公開URLを開き直し、ホーム画面のアプリを終了・再起動すると新しい表示に切り替わることがあります。</p></section>
<section class="panel"><h3>よくある質問・注意点</h3><details><summary>記録はほかの人に見える？</summary><p>入力した記録は基本的にこの端末のブラウザ内に保存されます。公開されるのはアプリ本体で、あなたの記録ではありません。ただし端末を共有すると記録を見られる可能性があります。</p></details><details><summary>別の端末でも同じ記録を使える？</summary><p>自動同期はありません。元の端末でJSONバックアップを保存し、移行先で復元してください。</p></details><details><summary>アプリを消しても記録は残る？</summary><p>アプリの削除やWebサイトデータの消去によって記録が失われる場合があります。削除や端末変更の前には必ずバックアップを保存してください。</p></details><details><summary>オフラインで使える？</summary><p>最初にインターネット接続で開いて読み込みが完了していれば、基本機能はオフラインで使えます。端末の設定や保存状態によっては再読み込みが必要です。</p></details></section>
<div class="row">${button('ホームに戻る',"go('home')",'primary')}${button('データ管理へ',"go('data')")}</div>`}
function dataPage(){return `<div class="eyebrow">SETTINGS & BACKUP</div><h1 class="h1">データ管理</h1><div class="notice">${storageAvailable?'✓ 記録はこの端末に自動保存されています。':'⚠ 自動保存を利用できません。記録を別のファイルに保存してください。'}<br>別の端末には自動で引き継がれません。機種変更やアプリの削除に備えて、定期的にバックアップを保存しましょう。</div><section class="panel"><h3>記録のバックアップと復元</h3><p class="sub">大切な記録を守るために、保存用のファイルを作れます。復元すると現在の記録がすべて置き換わるため、復元前にもバックアップを取ってください。</p><div class="row">${button('記録をバックアップ','exportJson()','primary')}<label class="btn">保存したファイルから復元<input type="file" accept=".json,application/json" style="display:none" onchange="importJson(this.files[0])"></label>${button('自分史をPDFに保存','openPdfExport()')}</div><details class="backup-advanced"><summary>その他の保存・復元方法</summary><p class="sub">ファイルを保存できない場合などに、記録を文字データとしてコピーしたり、貼り付けて復元したりできます。コピーした内容には個人的な記録が含まれるため、取り扱いにご注意ください。</p><div class="row">${button('バックアップ内容を表示','showBackupText()')}${button('コピーしたデータから復元','showPasteImport()')}</div></details></section><section class="panel"><h3>完全削除用パスワード</h3><p class="sub">全記録一覧で出来事を完全削除する際に必要です。未設定の場合は削除できません。これは誤操作防止用であり、データの暗号化ではありません。</p><p class="tiny muted">${db.settings.deletePasswordHash?'設定済み':'未設定'}</p>${button(db.settings.deletePasswordHash?'パスワードを変更':'パスワードを設定','configureDeletePassword()')}</section><section class="panel"><h3>ライフステージ</h3><div class="list">${db.stages.map(s=>`<div class="item row"><span>${esc(s.name)}</span>${button('名前を変更',`renameStage('${s.id}')`,'small')}</div>`).join('')}</div><p>${button('＋ ライフステージを追加','addStage()','small')}</p></section><section class="panel"><h3>活動の管理</h3>${db.activities.length?db.activities.map(a=>`<div class="item row"><div><b>${esc(a.name)}</b><div class="tiny muted">${esc(stageName(a.stageId))}</div></div><div class="row">${button('名前変更',`renameActivity('${a.id}')`,'small')}${button(a.visible===false?'再表示':'非表示',`toggleActivity('${a.id}')`,'small')}</div></div>`).join(''):'<p class="muted">活動はまだ登録されていません。</p>'}</section><section class="panel"><h3>計測モード</h3><div class="field"><label>回答時のモード</label><select onchange="db.settings.mode=this.value;save()"><option value="normal" ${db.settings.mode==='normal'?'selected':''}>通常（15分間操作がなければ停止）</option><option value="focus" ${db.settings.mode==='focus'?'selected':''}>集中（5分で一時中断）</option></select></div><p class="tiny muted">回答時間は記録しますが、長さから性格や能力を判断しません。</p></section>`}function renameStage(sid){const s=db.stages.find(x=>x.id===sid),n=prompt('ライフステージ名',s.name);if(n?.trim()){s.name=n.trim();save();render()}}function addStage(){const n=prompt('追加するライフステージ名');if(n?.trim()){db.stages.push({id:id(),name:n.trim(),order:db.stages.length});save();render()}}function renameActivity(aid){const a=db.activities.find(x=>x.id===aid),n=prompt('活動名',a.name);if(n?.trim()){a.name=n.trim();save();render()}}function toggleActivity(aid){const a=db.activities.find(x=>x.id===aid);a.visible=a.visible===false;save();render()}function showBackupText(){const value=JSON.stringify(db,null,2);const overlay=document.createElement('div');overlay.className='modal-back';overlay.id='backupTextModal';overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h2>バックアップ用JSON</h2><p class="sub">ファイル保存ができない場合は全文をコピーして、iPhoneのメモ等に貼り付けて保管してください。個人情報を含むため共有先に注意してください。</p><textarea id="backupTextValue" style="min-height:190px;font-size:12px" readonly></textarea><div class="row"><button class="btn" onclick="document.getElementById('backupTextModal').remove()">閉じる</button><button class="btn primary" onclick="copyBackupText()">コピー</button></div></div>`;document.body.appendChild(overlay);document.getElementById('backupTextValue').value=value}async function copyBackupText(){const input=document.getElementById('backupTextValue');try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(input.value);notify('コピーしました');return}}catch(e){}input.focus();input.select();notify('全文を選択しました。コピーしてください')}
function showPasteImport(){const overlay=document.createElement('div');overlay.className='modal-back';overlay.id='pasteImportModal';overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h2>JSONを貼り付けて復元</h2><p class="sub">以前の端末でコピーしたJSONを貼り付けてください。現在の記録は置き換わります。</p><textarea id="pasteImportValue" style="min-height:190px;font-size:12px" placeholder="{ ... }"></textarea><div class="row"><button class="btn" onclick="document.getElementById('pasteImportModal').remove()">キャンセル</button><button class="btn primary" onclick="applyPastedJson()">読み込む</button></div></div>`;document.body.appendChild(overlay)}
function applyPastedJson(){try{const value=document.getElementById('pasteImportValue').value;const parsed=JSON.parse(value);if(!Array.isArray(parsed.stages)||!Array.isArray(parsed.events)||!Array.isArray(parsed.activities))throw Error('データ形式が異なります');if(!confirm('現在の記録を置き換えます。よろしいですか？'))return;db=parsed;const ok=save();document.getElementById('pasteImportModal')?.remove();go('home');notify(ok?'データを復元しました':'画面上には復元しましたが、この環境では自動保存できません。必ずJSONをコピーしてください')}catch(err){alert('読み込み失敗：'+err.message)}}
function exportJson(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='watashi-map-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importJson(file){if(!file)return;try{const raw=typeof file.text==='function'?await file.text():await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsText(file)});const parsed=JSON.parse(raw);if(!Array.isArray(parsed.stages)||!Array.isArray(parsed.events)||!Array.isArray(parsed.activities))throw Error('形式が異なります');if(!confirm('現在のデータを読み込んだデータで置き換えます。よろしいですか？'))return;db=parsed;save();go('home');notify('データを読み込みました')}catch(e){alert('読み込めませんでした：'+e.message)}}
function stopTimer(){if(!session)return;const elapsed=Math.max(0,Math.floor((Date.now()-session.started)/1000));const e=eventBy(session.eventId),s=sceneBy(e,session.sceneId);if(e){const d=qdata(e,s,session.q);d.seconds=(d.seconds||0)+Math.min(elapsed,session.mode==='focus'?300:elapsed)}session=null;save()}function startTimer(){if(view!=='edit'||session)return;const e=eventBy(currentEvent);if(!e)return;session={eventId:e.id,sceneId:currentScene,q:currentQ,started:Date.now(),mode:db.settings.mode};lastInteraction=Date.now();syncTimerDisplay()}function syncTimerDisplay(){const x=document.getElementById('timerDisplay');if(x)x.textContent=session?`計測中（${session.mode==='focus'?'集中5分':'通常'}）`:'計測停止中'}document.addEventListener('keydown',()=>lastInteraction=Date.now(),{passive:true});document.addEventListener('pointerdown',()=>lastInteraction=Date.now(),{passive:true});setInterval(()=>{if(!session)return;const elapsed=Date.now()-session.started;if(session.mode==='focus'&&elapsed>=300000){stopTimer();notify('集中モードの5分が終了しました。下書きは保存されています。');render()}else if(session.mode==='normal'&&Date.now()-lastInteraction>=((db.settings.idle||15)*60000)){const idleMs=(db.settings.idle||15)*60000;const activeMs=Math.max(0,lastInteraction-session.started);session.started=Date.now()-(activeMs+idleMs);stopTimer();notify('操作がなかったため、時間計測を停止しました');render()}},1000);
render();if(db.last&&eventBy(db.last.eventId)){openEditor(db.last.eventId,db.last.sceneId,db.last.q||1,true)}
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
